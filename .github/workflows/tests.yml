name: Test

on:
  pull_request:
  push:
    branches: [develop, main]

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      db:
        image: postgres:18.6
        env:
          POSTGRES_DB: prenotazioni
          POSTGRES_USER: prenotazioni
          POSTGRES_PASSWORD: ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prenotazioni -d prenotazioni"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # CI-only values: this throwaway database protects nothing, so no GitHub secret is needed.
      DJANGO_SECRET_KEY: ci-only-insecure-key-not-used-anywhere-else-0123456789
      DJANGO_DEBUG: "false"
      POSTGRES_DB: prenotazioni
      POSTGRES_USER: prenotazioni
      POSTGRES_PASSWORD: ci-password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install gettext
        run: sudo apt-get update && sudo apt-get install --yes gettext
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile translations
        run: python manage.py compilemessages
      - name: System check
        run: python manage.py check
      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Run tests
        run: python manage.py test --noinput
