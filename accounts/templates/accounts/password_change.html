{% extends "base.html" %}
{% load i18n %}

{% block content %}
<h1>{% translate "Cambia password" %}</h1>
{% if user.must_change_password %}
<p class="notice">{% translate "La tua password è temporanea: scegline una nuova per continuare." %}</p>
{% endif %}
<form method="post" class="card">
  {% csrf_token %}
  {{ form.as_div }}
  <button type="submit">{% translate "Salva la nuova password" %}</button>
</form>
{% endblock %}
